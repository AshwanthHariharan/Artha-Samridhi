<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artha Samridhi — Idea Details</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f1f2f6;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aa8;
            --accent-1: #1a237e;
            --accent-2: #283593;
            --accent-3: #3949ab;
            --accent-gradient: linear-gradient(135deg, #1a237e 0%, #283593 40%, #3949ab 70%, #5c6bc0 100%);
            --shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --success-color: #2e7d32;
            --error-color: #c62828;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: orbFloat 25s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: rgba(26, 35, 126, 0.06);
            top: -15%;
            right: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(57, 73, 171, 0.04);
            bottom: -15%;
            left: -10%;
            animation-delay: -8s;
        }
        .orb-3 {
            width: 400px;
            height: 400px;
            background: rgba(26, 35, 126, 0.03);
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: -16s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 50px) scale(0.9); }
            100% { transform: translate(30px, -30px) scale(1.05); }
        }

        /* ========== LANGUAGE SELECTOR ========== */
        .language-selector {
            position: relative;
            display: inline-block;
            margin-left: 10px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            font-family: inherit;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.10);
            color: var(--text-primary);
        }

        .lang-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius-sm);
            padding: 6px 0;
            box-shadow: var(--shadow-hover);
            min-width: 180px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }

        .lang-dropdown.open {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .lang-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .lang-item:hover {
            background: rgba(26, 35, 126, 0.04);
            color: var(--text-primary);
        }

        .lang-item.active {
            background: rgba(26, 35, 126, 0.06);
            color: var(--accent-1);
        }

        .lang-item .lang-code {
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .lang-item .lang-check {
            margin-left: auto;
            color: var(--accent-1);
            font-size: 0.7rem;
        }

        #translatingStatus {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 8px;
            display: none;
        }

        #translatingStatus i {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== NAVBAR ========== */
        .navbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1200px;
            z-index: 1000;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.04);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .navbar.scrolled {
            top: 0;
            left: 0;
            transform: translateX(0);
            width: 100%;
            max-width: 100%;
            border-radius: 0;
            padding: 10px 32px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 30px rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .navbar .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .logo .logo-img {
            height: 38px;
            width: 38px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid rgba(26, 35, 126, 0.10);
            padding: 2px;
            transition: var(--transition);
        }

        .navbar.scrolled .logo .logo-img {
            height: 34px;
            width: 34px;
        }

        .logo .logo-text {
            color: var(--text-primary);
            font-weight: 700;
        }

        .logo .logo-text .highlight {
            color: var(--accent-1);
        }

        .logo .logo-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-gradient);
            margin-left: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
            padding: 4px 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gradient);
            transition: var(--transition);
            border-radius: 4px;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            padding: 10px 40px;
            background: var(--accent-gradient);
            color: #fff !important;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(26, 35, 126, 0.15);
            letter-spacing: 0.02em;
            min-width: 120px;
            text-align: center;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(26, 35, 126, 0.20);
            color: #fff !important;
        }

        .nav-cta i {
            margin-right: 8px;
        }

        .navbar.scrolled .nav-cta {
            padding: 10px 44px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 140px 24px 60px;
            position: relative;
            z-index: 1;
        }

        .idea-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius);
            padding: 40px 44px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .idea-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
            opacity: 0.3;
        }

        .idea-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .idea-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .idea-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .idea-title .company {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .idea-body {
            margin-bottom: 24px;
        }

        .idea-body .section {
            margin-bottom: 20px;
        }

        .idea-body .section h3 {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .idea-body .section .content {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.8;
            background: rgba(0, 0, 0, 0.02);
            padding: 16px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .idea-body .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .idea-body .info-item {
            background: rgba(0, 0, 0, 0.02);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .idea-body .info-item .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .idea-body .info-item .value {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-top: 2px;
            word-break: break-word;
        }

        .file-download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(26, 35, 126, 0.06);
            color: var(--accent-1);
            border: 1px solid rgba(26, 35, 126, 0.08);
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            margin-right: 8px;
            cursor: pointer;
        }

        .file-download-btn:hover {
            background: rgba(26, 35, 126, 0.10);
            transform: translateY(-2px);
        }

        .file-download-btn i {
            margin-right: 4px;
        }

        .file-download-btn .fa-spinner {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .interest-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .interest-section h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .radio-group label:hover {
            background: rgba(26, 35, 126, 0.04);
            border-color: rgba(26, 35, 126, 0.08);
        }

        .radio-group input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-1);
            cursor: pointer;
        }

        .radio-group label.checked {
            background: rgba(26, 35, 126, 0.06);
            border-color: var(--accent-1);
        }

        .btn-submit-interest {
            padding: 12px 34px;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(26, 35, 126, 0.15);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-submit-interest:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 36px rgba(26, 35, 126, 0.25);
        }

        .btn-submit-interest:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-back {
            padding: 12px 34px;
            background: rgba(0, 0, 0, 0.03);
            color: var(--text-secondary);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 100px;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: translateY(-3px);
            color: var(--text-primary);
        }

        .alert {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            border: 1px solid transparent;
        }

        .alert.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .alert.error {
            background: rgba(198, 40, 40, 0.06);
            border-color: rgba(198, 40, 40, 0.12);
            color: var(--error-color);
        }

        .alert.success {
            background: rgba(46, 125, 50, 0.06);
            border-color: rgba(46, 125, 50, 0.12);
            color: var(--success-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .file-error {
            font-size: 0.8rem;
            color: var(--error-color);
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .navbar {
                top: 0;
                left: 0;
                transform: translateX(0);
                width: 100%;
                border-radius: 0;
                padding: 10px 16px;
                background: rgba(255, 255, 255, 0.90);
                box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            }
            .navbar.scrolled {
                padding: 8px 16px;
            }
            .nav-links {
                display: none;
            }
            .container {
                padding: 110px 16px 30px;
            }
            .idea-card {
                padding: 24px 18px;
            }
            .idea-header {
                flex-direction: column;
                text-align: center;
            }
            .idea-title h1 {
                font-size: 1.3rem;
            }
            .idea-body .info-grid {
                grid-template-columns: 1fr;
            }
            .radio-group {
                flex-direction: column;
                gap: 8px;
            }
            .actions {
                flex-direction: column;
            }
            .actions .btn-submit-interest,
            .actions .btn-back {
                justify-content: center;
            }
            .nav-cta {
                padding: 8px 24px;
                font-size: 0.8rem;
                min-width: 80px;
            }
            .language-selector {
                margin-left: 4px;
            }
            .lang-btn .lang-label {
                display: none;
            }
            .lang-dropdown {
                right: -20px;
                min-width: 160px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 100px 12px 20px;
            }
            .idea-card {
                padding: 18px 14px;
                border-radius: 12px;
            }
            .idea-avatar {
                width: 48px;
                height: 48px;
                font-size: 1.2rem;
            }
            .idea-title h1 {
                font-size: 1.1rem;
            }
            .navbar {
                padding: 8px 14px;
            }
            .navbar.scrolled {
                padding: 6px 14px;
            }
            .logo .logo-img {
                height: 28px;
                width: 28px;
            }
            .logo .logo-text {
                font-size: 1rem;
            }
            .nav-cta {
                padding: 6px 18px;
                font-size: 0.75rem;
                min-width: 60px;
            }
            .nav-cta i {
                margin-right: 4px;
            }
            .file-download-btn {
                display: block;
                text-align: center;
                margin-bottom: 8px;
            }
            .lang-btn {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            .lang-dropdown {
                right: -40px;
                min-width: 140px;
            }
        }
                /* ========== CHATBOT BUTTON ========== */
        .chatbot-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(26, 35, 126, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .chatbot-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 40px rgba(26, 35, 126, 0.35);
        }

        .chatbot-fab .fa-robot {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ===== CHATBOT SIDEBAR ===== */
        .chatbot-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: var(--bg-card);
            box-shadow: -4px 0 40px rgba(0, 0, 0, 0.08);
            z-index: 1001;
            transition: right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(0, 0, 0, 0.04);
        }

        .chatbot-sidebar.open {
            right: 0;
        }

        .chatbot-sidebar-header {
            padding: 20px 24px;
            background: var(--accent-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chatbot-sidebar-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chatbot-sidebar-header .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 4px;
        }

        .chatbot-sidebar-header .close-btn:hover {
            color: #fff;
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-primary);
        }

        .chatbot-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: rgba(26, 35, 126, 0.15);
            border-radius: 10px;
        }

        .chatbot-message {
            display: flex;
            gap: 10px;
            max-width: 92%;
            animation: slideIn 0.3s ease;
        }

        .chatbot-message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chatbot-message.bot {
            align-self: flex-start;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chatbot-message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .chatbot-message.bot .chatbot-message-avatar {
            background: var(--accent-gradient);
            color: #fff;
        }

        .chatbot-message.user .chatbot-message-avatar {
            background: rgba(0, 0, 0, 0.06);
            color: var(--text-muted);
        }

        .chatbot-message-content {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.6;
            word-wrap: break-word;
            max-width: 100%;
        }

        .chatbot-message.bot .chatbot-message-content {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-top-left-radius: 4px;
        }

        .chatbot-message.user .chatbot-message-content {
            background: var(--accent-gradient);
            color: #fff;
            border-top-right-radius: 4px;
        }

        .chatbot-message-content p {
            margin: 0;
        }

        .chatbot-message-content p + p {
            margin-top: 6px;
        }

        .chatbot-typing {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .chatbot-typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .chatbot-typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .chatbot-typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .chatbot-input-area {
            padding: 16px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            background: var(--bg-card);
        }

        .chatbot-input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 100px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .chatbot-input-area input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.06);
        }

        .chatbot-input-area input::placeholder {
            color: var(--text-muted);
        }

        .chatbot-send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chatbot-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(26, 35, 126, 0.20);
        }

        .chatbot-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .chatbot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .chatbot-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body>

    <!-- ===== SOFT ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Artha Samridhi" class="logo-img" onerror="this.style.display='none'" />
                <span class="logo-text">Artha<span class="highlight">Samridhi</span><span class="logo-dot"></span></span>
            </a>

            <div class="nav-links">
                <a href="investor-dashboard.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
                <a href="profile.html" class="nav-cta">
                    <i class="fas fa-user"></i> Profile
                </a>
            </div>

            <!-- ===== LANGUAGE SELECTOR ===== -->
            <div class="language-selector">
                <button class="lang-btn" onclick="toggleLanguageMenu()" title="Select Language (Ctrl+Shift+L)">
                    <i class="fas fa-globe"></i>
                    <span id="currentLangLabel" class="lang-label">English</span>
                    <i class="fas fa-chevron-down" style="font-size: 0.6rem;"></i>
                </button>
                <div class="lang-dropdown" id="langDropdown"></div>
            </div>
            <span id="translatingStatus"><i class="fas fa-spinner fa-spin"></i> Translating...</span>

        </div>
    </nav>

    <!-- ===== CONTENT ===== -->
    <div class="container">
        <div class="idea-card">
            <div id="ideaContent">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>
    </div>
        <!-- ===== CHATBOT FAB BUTTON ===== -->
    <button class="chatbot-fab" onclick="toggleChatbot()" id="chatbotToggle" title="Chat with AI Assistant">
        <i class="fas fa-robot"></i>
    </button>

    <!-- ===== CHATBOT SIDEBAR ===== -->
    <div class="chatbot-sidebar" id="chatbotSidebar">
        <div class="chatbot-sidebar-header">
            <h3><i class="fas fa-robot"></i> AI Assistant</h3>
            <button class="close-btn" onclick="toggleChatbot()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="chatbot-message bot">
                <div class="chatbot-message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="chatbot-message-content">
                    <p>Hello! 👋 I'm your AI assistant for Artha Samridhi. How can I help you with your venture today?</p>
                </div>
            </div>
        </div>
        <div class="chatbot-input-area">
            <input type="text" id="chatbotInput" placeholder="Type your message..." onkeydown="handleChatbotKeypress(event)" />
            <button class="chatbot-send-btn" onclick="sendChatbotMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="translator.js"></script>
    <script src="chatbot.js"></script>
    <script>
        // ===== CONFIGURATION =====
        const API_URL = 'http://localhost:5000';

        // ===== CHECK USER =====
        const userData = JSON.parse(localStorage.getItem('userData'));
        if (!userData) {
            window.location.href = 'index.html';
        }

        if (userData.role !== 'INVESTOR') {
            window.location.href = 'profile.html';
        }

        // ===== NAVBAR SCROLL =====
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 30) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        }, { passive: true });

        // ===== GET ENTREPRENEUR ID FROM URL =====
        const entrepreneurId = localStorage.getItem('viewingEntrepreneurId');

        if (!entrepreneurId) {
            window.location.href = 'investor-dashboard.html';
        }

        // ===== GET INITIALS =====
        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ')
                .map(n => n[0])
                .join('')
                .toUpperCase()
                .slice(0, 2);
        }

        // ===== DOWNLOAD FILE =====
        async function downloadFile(type, entrepreneurId, fileName) {
            const btn = document.getElementById(`btn-${type}`);
            if (!btn) return;

            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Downloading...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/download/${type}/${entrepreneurId}`);

                if (!response.ok) {
                    const error = await response.json();
                    showAlert(error.error || 'Failed to download file', 'error');
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    return;
                }

                // Get the blob from response
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();

                showAlert('✅ File downloaded successfully!', 'success');

            } catch (error) {
                console.error('Download error:', error);
                showAlert('Error downloading file. Please try again.', 'error');
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // ===== FETCH ENTREPRENEUR DETAILS =====
        async function fetchEntrepreneurDetails() {
            const container = document.getElementById('ideaContent');

            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                    <div style="display: inline-block; width: 30px; height: 30px; border: 3px solid rgba(0,0,0,0.06); border-radius: 50%; border-top-color: var(--accent-1); animation: spin 0.8s linear infinite; margin-bottom: 12px;"></div>
                    <p>Loading entrepreneur details...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}/api/user/${entrepreneurId}`);
                const result = await response.json();

                if (response.ok && result.user) {
                    const entrepreneur = result.user;
                    const ideas = entrepreneur.ideas || [];
                    const lastIdea = ideas.length > 0 ? ideas[ideas.length - 1] : null;

                    if (!lastIdea) {
                        container.innerHTML = `
                            <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
                                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; opacity: 0.3; margin-bottom: 16px;"></i>
                                <h4 style="color: var(--text-primary);">No Idea Found</h4>
                                <p>This entrepreneur hasn't uploaded any ideas yet.</p>
                                <a href="investor-dashboard.html" class="btn-back" style="margin-top: 20px;">
                                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                                </a>
                            </div>
                        `;
                        return;
                    }

                    const initials = getInitials(entrepreneur.fullName);
                    const companyName = entrepreneur.entrepreneurDetails?.companyName || 'N/A';

                    container.innerHTML = `
                        <div class="idea-header">
                            <div class="idea-avatar">${initials}</div>
                            <div class="idea-title">
                                <h1>${entrepreneur.fullName}</h1>
                                <div class="company"><i class="fas fa-building"></i> ${companyName}</div>
                            </div>
                        </div>

                        <div class="idea-body">
                            <div class="info-grid">
                                <div class="info-item">
                                    <div class="label">Email</div>
                                    <div class="value"><i class="fas fa-envelope"></i> ${entrepreneur.email}</div>
                                </div>
                                <div class="info-item">
                                    <div class="label">Mobile</div>
                                    <div class="value"><i class="fas fa-phone"></i> ${entrepreneur.mobile}</div>
                                </div>
                                <div class="info-item">
                                    <div class="label">Capital Needed</div>
                                    <div class="value"><i class="fas fa-dollar-sign"></i> $${lastIdea.capitalNeeded}</div>
                                </div>
                                <div class="info-item">
                                    <div class="label">Submitted On</div>
                                    <div class="value"><i class="fas fa-calendar"></i> ${new Date(lastIdea.submittedAt).toLocaleDateString()}</div>
                                </div>
                            </div>

                            <div class="section" style="margin-top: 20px;">
                                <h3><i class="fas fa-file-alt"></i> Abstract</h3>
                                <div class="content">${lastIdea.ideaAbstract}</div>
                            </div>

                            <div class="section">
                                <h3><i class="fas fa-paperclip"></i> Attachments</h3>
                                <div>
                                    <button class="file-download-btn" id="btn-poc" onclick="downloadFile('poc', '${entrepreneurId}', '${lastIdea.pocReportName}')">
                                        <i class="fas fa-file-pdf"></i> ${lastIdea.pocReportName}
                                    </button>
                                    <button class="file-download-btn" id="btn-business-plan" onclick="downloadFile('business-plan', '${entrepreneurId}', '${lastIdea.businessPlanName}')">
                                        <i class="fas fa-file-alt"></i> ${lastIdea.businessPlanName}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="interest-section">
                            <h3><i class="fas fa-heart"></i> Express Your Interest</h3>
                            <form id="interestForm">
                                <div class="radio-group" id="radioGroup">
                                    <label class="interest-option">
                                        <input type="radio" name="interest" value="Low Interest" />
                                        <span>🔵 Low Interest</span>
                                    </label>
                                    <label class="interest-option">
                                        <input type="radio" name="interest" value="Medium Interest" />
                                        <span>🟡 Medium Interest</span>
                                    </label>
                                    <label class="interest-option">
                                        <input type="radio" name="interest" value="High Interest" />
                                        <span>🔴 High Interest</span>
                                    </label>
                                </div>

                                <div id="alert" class="alert"></div>

                                <div class="actions">
                                    <button type="submit" class="btn-submit-interest" id="submitBtn">
                                        <i class="fas fa-paper-plane"></i> Submit Interest
                                    </button>
                                    <a href="investor-dashboard.html" class="btn-back">
                                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                                    </a>
                                </div>
                            </form>
                        </div>
                    `;

                    // Add click handlers for radio labels
                    document.querySelectorAll('.interest-option').forEach(label => {
                        label.addEventListener('click', function() {
                            document.querySelectorAll('.interest-option').forEach(l => l.classList.remove('checked'));
                            this.classList.add('checked');
                            const radio = this.querySelector('input[type="radio"]');
                            if (radio) radio.checked = true;
                        });
                    });

                    // Form submission
                    document.getElementById('interestForm').addEventListener('submit', async function(e) {
                        e.preventDefault();

                        const selected = document.querySelector('input[name="interest"]:checked');
                        if (!selected) {
                            showAlert('Please select your interest level.', 'error');
                            return;
                        }

                        const submitBtn = document.getElementById('submitBtn');
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span class="spinner"></span> Submitting...';

                        try {
                            const interestData = {
                                entrepreneurId: entrepreneurId,
                                entrepreneurName: entrepreneur.fullName,
                                companyName: companyName,
                                investorName: userData.fullName,
                                investorId: userData.id,
                                interestLevel: selected.value,
                                ideaAbstract: lastIdea.ideaAbstract.substring(0, 50) + '...',
                                submittedAt: new Date().toISOString()
                            };

                            const interests = JSON.parse(localStorage.getItem('investorInterests') || '[]');
                            const existing = interests.find(i => i.entrepreneurId === entrepreneurId && i.investorId === userData.id);
                            if (existing) {
                                existing.interestLevel = selected.value;
                                existing.submittedAt = new Date().toISOString();
                            } else {
                                interests.push(interestData);
                            }
                            localStorage.setItem('investorInterests', JSON.stringify(interests));

                            showAlert(`✅ Your interest (${selected.value}) has been submitted successfully! The entrepreneur will be notified.`, 'success');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Interest';

                        } catch (error) {
                            console.error('Error submitting interest:', error);
                            showAlert('Network error. Please try again.', 'error');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Interest';
                        }
                    });

                } else {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
                            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; opacity: 0.3; margin-bottom: 16px;"></i>
                            <h4 style="color: var(--text-primary);">Error Loading Data</h4>
                            <p>${result.error || 'Please try again later.'}</p>
                            <a href="investor-dashboard.html" class="btn-back" style="margin-top: 20px;">
                                <i class="fas fa-arrow-left"></i> Back to Dashboard
                            </a>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error fetching entrepreneur:', error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; opacity: 0.3; margin-bottom: 16px;"></i>
                        <h4 style="color: var(--text-primary);">Network Error</h4>
                        <p>Please check if the server is running.</p>
                        <a href="investor-dashboard.html" class="btn-back" style="margin-top: 20px;">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                `;
            }
        }

        // ===== ALERT HELPER =====
        function showAlert(message, type = 'error') {
            const alertDiv = document.getElementById('alert');
            if (!alertDiv) return;
            alertDiv.textContent = message;
            alertDiv.className = 'alert ' + type + ' show';
            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 5000);
        }

        // ===== INIT =====
        fetchEntrepreneurDetails();

        console.log('%c📄 Idea Details', 'font-size: 16px; font-weight: bold; color: #1a237e;');
        console.log('%c💡 Viewing entrepreneur idea', 'font-size: 14px; color: #4a4a6a;');
        console.log('%c📁 Click on POC or Business Plan to download the actual files', 'font-size: 12px; color: #f77f00;');
        console.log('%c📧 Interests will be stored and visible in entrepreneur dashboard', 'font-size: 12px; color: #8a8aa8;');
        console.log('%c🌐 Language selector available - click the globe icon to translate', 'font-size: 12px; color: #1a237e;');
    </script>

</body>
</html>
