<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VentureCap — CA Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f1f2f6;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aa8;
            --accent-1: #1a237e;
            --accent-2: #283593;
            --accent-3: #3949ab;
            --accent-gradient: linear-gradient(135deg, #1a237e 0%, #283593 40%, #3949ab 70%, #5c6bc0 100%);
            --shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 8px 40px rgba(26, 35, 126, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --success-color: #2e7d32;
            --error-color: #c62828;
            --active-tab: #1a237e;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== SOFT ORBS ========== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: orbFloat 25s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: rgba(26, 35, 126, 0.06);
            top: -15%;
            right: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(57, 73, 171, 0.04);
            bottom: -15%;
            left: -10%;
            animation-delay: -8s;
        }
        .orb-3 {
            width: 400px;
            height: 400px;
            background: rgba(26, 35, 126, 0.03);
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: -16s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 50px) scale(0.9); }
            100% { transform: translate(30px, -30px) scale(1.05); }
        }

        /* ========== LANGUAGE SELECTOR ========== */
        .language-selector {
            position: relative;
            display: inline-block;
            margin-left: 10px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            font-family: inherit;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.10);
            color: var(--text-primary);
        }

        .lang-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius-sm);
            padding: 6px 0;
            box-shadow: var(--shadow-hover);
            min-width: 180px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }

        .lang-dropdown.open {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .lang-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .lang-item:hover {
            background: rgba(26, 35, 126, 0.04);
            color: var(--text-primary);
        }

        .lang-item.active {
            background: rgba(26, 35, 126, 0.06);
            color: var(--accent-1);
        }

        .lang-item .lang-code {
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .lang-item .lang-check {
            margin-left: auto;
            color: var(--accent-1);
            font-size: 0.7rem;
        }

        #translatingStatus {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 8px;
            display: none;
        }

        #translatingStatus i {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== NAVBAR ========== */
        .navbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1200px;
            z-index: 1000;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.04);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .navbar.scrolled {
            top: 0;
            left: 0;
            transform: translateX(0);
            width: 100%;
            max-width: 100%;
            border-radius: 0;
            padding: 10px 32px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 30px rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .navbar .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .logo .logo-img {
            height: 38px;
            width: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(26, 35, 126, 0.10);
            padding: 2px;
            transition: var(--transition);
        }

        .navbar.scrolled .logo .logo-img {
            height: 34px;
            width: 34px;
        }

        .logo .logo-text {
            color: var(--text-primary);
            font-weight: 700;
        }

        .logo .logo-text .highlight {
            color: var(--accent-1);
        }

        .logo .logo-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-gradient);
            margin-left: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
            padding: 4px 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gradient);
            transition: var(--transition);
            border-radius: 4px;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            padding: 10px 40px;
            background: var(--accent-gradient);
            color: #fff !important;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(26, 35, 126, 0.15);
            letter-spacing: 0.02em;
            min-width: 120px;
            text-align: center;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(26, 35, 126, 0.20);
            color: #fff !important;
        }

        .nav-cta i {
            margin-right: 8px;
        }

        .navbar.scrolled .nav-cta {
            padding: 10px 44px;
        }

        /* ========== DASHBOARD CONTAINER ========== */
        .dashboard-container {
            padding: 140px 24px 60px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ========== HEADER ========== */
        .dashboard-header {
            margin-bottom: 32px;
        }

        .dashboard-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .dashboard-header h1 .highlight {
            color: var(--accent-1);
        }

        .dashboard-header p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 4px;
        }

        /* ========== TABS ========== */
        .tabs-container {
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.04);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 28px;
            background: none;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .tab-btn:hover {
            background: rgba(26, 35, 126, 0.04);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: rgba(26, 35, 126, 0.06);
            color: var(--accent-1);
            font-weight: 600;
        }

        .tab-btn .tab-count {
            background: rgba(0, 0, 0, 0.04);
            padding: 1px 10px;
            border-radius: 100px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .tab-btn.active .tab-count {
            background: rgba(26, 35, 126, 0.08);
            color: var(--accent-1);
        }

        /* ===== TAB CONTENT ===== */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== USER GRID ===== */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .user-card {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-card:hover {
            border-color: rgba(26, 35, 126, 0.08);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-info .name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-info .details {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .user-info .details span {
            margin-right: 10px;
        }

        .user-info .details i {
            margin-right: 3px;
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        .user-badge {
            font-size: 0.6rem;
            padding: 3px 10px;
            border-radius: 100px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .user-badge.entrepreneur {
            background: rgba(57, 73, 171, 0.08);
            color: var(--accent-3);
        }

        .user-badge.investor {
            background: rgba(26, 35, 126, 0.08);
            color: var(--accent-1);
        }

        .no-users {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .no-users i {
            font-size: 3.5rem;
            opacity: 0.2;
            margin-bottom: 12px;
            color: var(--accent-1);
        }

        .no-users h4 {
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .no-users p {
            font-size: 0.9rem;
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 0, 0, 0.06);
            border-radius: 50%;
            border-top-color: var(--accent-1);
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== STOCK MARKET PANEL ========== */
        .stock-panel {
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-top: 24px;
        }

        .stock-panel h3 {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stock-panel h3 i {
            color: var(--accent-1);
        }

        .stock-panel .stock-update {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-left: auto;
            font-weight: 400;
            text-transform: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stock-panel .stock-update .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success-color);
            animation: pulseDot 1.5s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }

        .stock-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .stock-item:hover {
            background: rgba(26, 35, 126, 0.04);
            border-color: rgba(26, 35, 126, 0.08);
        }

        .stock-item .stock-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stock-item .stock-symbol {
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-primary);
        }

        .stock-item .stock-name {
            font-size: 0.65rem;
            color: var(--text-secondary);
            display: none;
        }

        .stock-item .stock-price {
            display: none;
        }

        .stock-item .stock-change {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 100px;
            min-width: 50px;
            text-align: center;
        }

        .stock-item .stock-change.up {
            background: rgba(46, 125, 50, 0.08);
            color: var(--success-color);
        }

        .stock-item .stock-change.down {
            background: rgba(198, 40, 40, 0.08);
            color: var(--error-color);
        }

        .stock-item .stock-change .arrow {
            margin-right: 2px;
        }

        .stock-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 8px;
        }

        .stock-footer .stock-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ========== CHATBOT BUTTON ========== */
        .chatbot-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(26, 35, 126, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .chatbot-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 40px rgba(26, 35, 126, 0.35);
        }

        .chatbot-fab .fa-robot {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ===== CHATBOT SIDEBAR ===== */
        .chatbot-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: var(--bg-card);
            box-shadow: -4px 0 40px rgba(0, 0, 0, 0.08);
            z-index: 1001;
            transition: right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(0, 0, 0, 0.04);
        }

        .chatbot-sidebar.open {
            right: 0;
        }

        .chatbot-sidebar-header {
            padding: 20px 24px;
            background: var(--accent-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chatbot-sidebar-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chatbot-sidebar-header .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 4px;
        }

        .chatbot-sidebar-header .close-btn:hover {
            color: #fff;
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-primary);
        }

        .chatbot-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: rgba(26, 35, 126, 0.15);
            border-radius: 10px;
        }

        .chatbot-message {
            display: flex;
            gap: 10px;
            max-width: 92%;
            animation: slideIn 0.3s ease;
        }

        .chatbot-message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chatbot-message.bot {
            align-self: flex-start;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chatbot-message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .chatbot-message.bot .chatbot-message-avatar {
            background: var(--accent-gradient);
            color: #fff;
        }

        .chatbot-message.user .chatbot-message-avatar {
            background: rgba(0, 0, 0, 0.06);
            color: var(--text-muted);
        }

        .chatbot-message-content {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.6;
            word-wrap: break-word;
            max-width: 100%;
        }

        .chatbot-message.bot .chatbot-message-content {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-top-left-radius: 4px;
        }

        .chatbot-message.user .chatbot-message-content {
            background: var(--accent-gradient);
            color: #fff;
            border-top-right-radius: 4px;
        }

        .chatbot-message-content p {
            margin: 0;
        }

        .chatbot-message-content p + p {
            margin-top: 6px;
        }

        .chatbot-typing {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .chatbot-typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .chatbot-typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .chatbot-typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .chatbot-input-area {
            padding: 16px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            background: var(--bg-card);
        }

        .chatbot-input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 100px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .chatbot-input-area input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.06);
        }

        .chatbot-input-area input::placeholder {
            color: var(--text-muted);
        }

        .chatbot-send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chatbot-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(26, 35, 126, 0.20);
        }

        .chatbot-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .chatbot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .chatbot-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            .stock-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .navbar {
                top: 0;
                left: 0;
                transform: translateX(0);
                width: 100%;
                border-radius: 0;
                padding: 10px 16px;
                background: rgba(255, 255, 255, 0.90);
                box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            }
            .navbar.scrolled {
                padding: 8px 16px;
            }
            .nav-links {
                display: none;
            }
            .dashboard-container {
                padding: 110px 16px 30px;
            }
            .tabs-container {
                padding: 16px 16px;
            }
            .tab-btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            .user-grid {
                grid-template-columns: 1fr;
            }
            .dashboard-header h1 {
                font-size: 1.5rem;
            }
            .nav-cta {
                padding: 8px 24px;
                font-size: 0.8rem;
                min-width: 80px;
            }
            .stock-grid {
                grid-template-columns: 1fr 1fr;
            }
            .stock-item .stock-name {
                display: inline;
            }
            .chatbot-sidebar {
                width: 100%;
                right: -100%;
            }
            .chatbot-fab {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
                bottom: 20px;
                right: 20px;
            }
            .language-selector {
                margin-left: 4px;
            }
            .lang-btn .lang-label {
                display: none;
            }
            .lang-dropdown {
                right: -20px;
                min-width: 160px;
            }
        }

        @media (max-width: 480px) {
            .dashboard-container {
                padding: 100px 12px 20px;
            }
            .dashboard-header h1 {
                font-size: 1.3rem;
            }
            .navbar {
                padding: 8px 14px;
            }
            .navbar.scrolled {
                padding: 6px 14px;
            }
            .logo .logo-img {
                height: 28px;
                width: 28px;
            }
            .logo .logo-text {
                font-size: 1rem;
            }
            .nav-cta {
                padding: 6px 18px;
                font-size: 0.75rem;
                min-width: 60px;
            }
            .nav-cta i {
                margin-right: 4px;
            }
            .tabs {
                flex-direction: column;
                gap: 4px;
            }
            .tab-btn {
                justify-content: center;
                padding: 10px;
            }
            .user-card {
                flex-wrap: wrap;
                gap: 10px;
            }
            .user-badge {
                margin-left: auto;
            }
            .stock-grid {
                grid-template-columns: 1fr;
            }
            .stock-item {
                padding: 8px 12px;
            }
            .lang-btn {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            .lang-dropdown {
                right: -40px;
                min-width: 140px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== SOFT ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="VentureCap" class="logo-img" onerror="this.style.display='none'" />
                <span class="logo-text">Venture<span class="highlight">Cap</span><span class="logo-dot"></span></span>
            </a>

            <div class="nav-links">
                <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
                <a href="index.html" class="nav-cta">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>

            <!-- ===== LANGUAGE SELECTOR ===== -->
            <div class="language-selector">
                <button class="lang-btn" onclick="toggleLanguageMenu()" title="Select Language (Ctrl+Shift+L)">
                    <i class="fas fa-globe"></i>
                    <span id="currentLangLabel" class="lang-label">English</span>
                    <i class="fas fa-chevron-down" style="font-size: 0.6rem;"></i>
                </button>
                <div class="lang-dropdown" id="langDropdown"></div>
            </div>
            <span id="translatingStatus"><i class="fas fa-spinner fa-spin"></i> Translating...</span>

        </div>
    </nav>

    <!-- ===== DASHBOARD CONTAINER ===== -->
    <div class="dashboard-container">

        <!-- ===== HEADER ===== -->
        <div class="dashboard-header">
            <h1>CA <span class="highlight">Dashboard</span></h1>
            <p>View and manage registered entrepreneurs and investors on VentureCap.</p>
        </div>

        <!-- ===== TABS ===== -->
        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-btn active" data-tab="entrepreneurs" onclick="switchTab('entrepreneurs')">
                    <i class="fas fa-lightbulb"></i> Entrepreneurs
                    <span class="tab-count" id="entrepreneurCount">0</span>
                </button>
                <button class="tab-btn" data-tab="investors" onclick="switchTab('investors')">
                    <i class="fas fa-chart-line"></i> Investors
                    <span class="tab-count" id="investorCount">0</span>
                </button>
            </div>

            <!-- ===== ENTREPRENEURS TAB ===== -->
            <div class="tab-content active" id="tab-entrepreneurs">
                <div id="entrepreneursList">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>

            <!-- ===== INVESTORS TAB ===== -->
            <div class="tab-content" id="tab-investors">
                <div id="investorsList">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- ===== STOCK MARKET PANEL ===== -->
        <div class="stock-panel">
            <h3>
                <i class="fas fa-chart-line"></i> Market Watch
                <span class="stock-update">
                    <span class="live-dot"></span>
                    <span id="stockStatus">LIVE</span>
                </span>
            </h3>
            <div class="stock-grid" id="stockList">
                <!-- Will be populated by JavaScript -->
            </div>
            <div class="stock-footer">
                <span class="stock-status">
                    <i class="fas fa-info-circle"></i> 
                    <span id="stockSource">Real-time data</span>
                </span>
                <span>Updated: <span id="stockUpdateTime">Just now</span></span>
            </div>
        </div>

    </div>

    <!-- ===== CHATBOT FAB BUTTON ===== -->
    <button class="chatbot-fab" onclick="toggleChatbot()" id="chatbotToggle" title="Chat with AI Assistant">
        <i class="fas fa-robot"></i>
    </button>

    <!-- ===== CHATBOT SIDEBAR ===== -->
    <div class="chatbot-sidebar" id="chatbotSidebar">
        <div class="chatbot-sidebar-header">
            <h3><i class="fas fa-robot"></i> AI Assistant</h3>
            <button class="close-btn" onclick="toggleChatbot()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="chatbot-message bot">
                <div class="chatbot-message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="chatbot-message-content">
                    <p>Hello! 👋 I'm your AI assistant for Artha Samridhi. How can I help you with your venture today?</p>
                </div>
            </div>
        </div>
        <div class="chatbot-input-area">
            <input type="text" id="chatbotInput" placeholder="Type your message..." onkeydown="handleChatbotKeypress(event)" />
            <button class="chatbot-send-btn" onclick="sendChatbotMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="chatbot.js"></script>
    <script src="translator.js"></script>
    <script>
        // ===== CONFIGURATION =====
        const API_URL = 'http://localhost:5000';
        const ALPHA_VANTAGE_API_KEY = 'demo';

        // ===== CHECK USER & ROLE =====
        const userData = JSON.parse(localStorage.getItem('userData'));

        if (!userData) {
            window.location.href = 'index.html';
        }

        if (userData.role !== 'CA_GRADUATE') {
            window.location.href = 'profile.html';
        }

        // ===== NAVBAR SCROLL EFFECT =====
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 30) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        }, { passive: true });

        // ===== GET INITIALS =====
        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ')
                .map(n => n[0])
                .join('')
                .toUpperCase()
                .slice(0, 2);
        }

        // ===== SWITCH TAB =====
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.tab === tab) {
                    btn.classList.add('active');
                }
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        // ===== FETCH USERS =====
        async function fetchUsers() {
            const entrepreneursContainer = document.getElementById('entrepreneursList');
            const investorsContainer = document.getElementById('investorsList');
            const entrepreneurCount = document.getElementById('entrepreneurCount');
            const investorCount = document.getElementById('investorCount');

            entrepreneursContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading entrepreneurs...</p>
                </div>
            `;
            investorsContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading investors...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}/api/users`);
                const result = await response.json();

                if (response.ok && result.users) {
                    const entrepreneurs = result.users.filter(user => user.role === 'ENTREPRENEUR');
                    const investors = result.users.filter(user => user.role === 'INVESTOR');

                    entrepreneurCount.textContent = entrepreneurs.length;
                    investorCount.textContent = investors.length;

                    if (entrepreneurs.length === 0) {
                        entrepreneursContainer.innerHTML = `
                            <div class="no-users">
                                <i class="fas fa-lightbulb"></i>
                                <h4>No Entrepreneurs Registered</h4>
                                <p>Entrepreneurs who register on VentureCap will appear here.</p>
                            </div>
                        `;
                    } else {
                        entrepreneursContainer.innerHTML = `
                            <div class="user-grid">
                                ${entrepreneurs.map(user => `
                                    <div class="user-card">
                                        <div class="user-avatar">${getInitials(user.fullName)}</div>
                                        <div class="user-info">
                                            <div class="name">${user.fullName}</div>
                                            <div class="details">
                                                <span><i class="fas fa-envelope"></i> ${user.email}</span>
                                                <span><i class="fas fa-phone"></i> ${user.mobile}</span>
                                                <span><i class="fas fa-building"></i> ${user.entrepreneurDetails?.companyName || 'N/A'}</span>
                                            </div>
                                        </div>
                                        <span class="user-badge entrepreneur">Entrepreneur</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    if (investors.length === 0) {
                        investorsContainer.innerHTML = `
                            <div class="no-users">
                                <i class="fas fa-chart-line"></i>
                                <h4>No Investors Registered</h4>
                                <p>Investors who register on VentureCap will appear here.</p>
                            </div>
                        `;
                    } else {
                        investorsContainer.innerHTML = `
                            <div class="user-grid">
                                ${investors.map(user => `
                                    <div class="user-card">
                                        <div class="user-avatar">${getInitials(user.fullName)}</div>
                                        <div class="user-info">
                                            <div class="name">${user.fullName}</div>
                                            <div class="details">
                                                <span><i class="fas fa-envelope"></i> ${user.email}</span>
                                                <span><i class="fas fa-phone"></i> ${user.mobile}</span>
                                                <span><i class="fas fa-hand-holding-dollar"></i> $${user.investorDetails?.amount || 'N/A'}</span>
                                            </div>
                                        </div>
                                        <span class="user-badge investor">Investor</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                } else {
                    entrepreneursContainer.innerHTML = `
                        <div class="no-users">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h4>Error Loading Users</h4>
                            <p>${result.error || 'Please try again later.'}</p>
                        </div>
                    `;
                    investorsContainer.innerHTML = `
                        <div class="no-users">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h4>Error Loading Users</h4>
                            <p>${result.error || 'Please try again later.'}</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error fetching users:', error);
                entrepreneursContainer.innerHTML = `
                    <div class="no-users">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h4>Network Error</h4>
                        <p>Please check if the server is running.</p>
                    </div>
                `;
                investorsContainer.innerHTML = `
                    <div class="no-users">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h4>Network Error</h4>
                        <p>Please check if the server is running.</p>
                    </div>
                `;
            }
        }

        // ===== STOCK DATA =====
        const defaultStocks = [
            { symbol: 'RELIANCE', name: 'Reliance Industries', price: 2856.75, change: 2.4 },
            { symbol: 'TCS', name: 'Tata Consultancy', price: 3562.30, change: -1.2 },
            { symbol: 'HDFC', name: 'HDFC Bank', price: 1678.90, change: 0.8 },
            { symbol: 'INFY', name: 'Infosys', price: 1456.20, change: 3.1 },
            { symbol: 'ICICI', name: 'ICICI Bank', price: 987.45, change: -0.5 },
            { symbol: 'SBIN', name: 'SBI', price: 678.30, change: 1.7 },
            { symbol: 'BHARTI', name: 'Bharti Airtel', price: 1123.80, change: -2.3 },
            { symbol: 'ITC', name: 'ITC Limited', price: 456.75, change: 0.3 },
            { symbol: 'WIPRO', name: 'Wipro', price: 567.90, change: 1.9 },
            { symbol: 'AXIS', name: 'Axis Bank', price: 1124.50, change: -0.8 }
        ];

        let stockData = [];

        // ===== FETCH STOCKS FROM API =====
        async function fetchStocksFromAPI() {
            try {
                const cached = localStorage.getItem('stockData');
                const cachedTime = localStorage.getItem('stockDataTime');
                const now = Date.now();

                if (cached && cachedTime && (now - parseInt(cachedTime) < 3600000)) {
                    const parsed = JSON.parse(cached);
                    if (parsed && parsed.length > 0) {
                        stockData = parsed;
                        renderStocks();
                        updateStockTime();
                        return;
                    }
                }

                const symbols = ['RELIANCE.BSE', 'TCS.BSE', 'HDFCBANK.BSE', 'INFY.BSE', 'ICICIBANK.BSE', 'SBIN.BSE', 'BHARTIARTL.BSE', 'ITC.BSE', 'WIPRO.BSE', 'AXISBANK.BSE'];
                const apiKey = ALPHA_VANTAGE_API_KEY;

                const promises = symbols.map(async (symbol) => {
                    try {
                        const response = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${apiKey}`);
                        const data = await response.json();
                        
                        if (data['Global Quote']) {
                            const quote = data['Global Quote'];
                            return {
                                symbol: symbol.replace('.BSE', ''),
                                name: getStockName(symbol.replace('.BSE', '')),
                                price: parseFloat(quote['05. price']) || 0,
                                change: parseFloat(quote['10. change percent']) || 0
                            };
                        }
                        return null;
                    } catch (e) {
                        console.warn(`Failed to fetch ${symbol}:`, e);
                        return null;
                    }
                });

                const results = await Promise.all(promises);
                const validStocks = results.filter(s => s !== null && s.price > 0);

                if (validStocks.length > 0) {
                    stockData = validStocks.sort((a, b) => Math.abs(b.change) - Math.abs(a.change));
                    localStorage.setItem('stockData', JSON.stringify(stockData));
                    localStorage.setItem('stockDataTime', Date.now().toString());
                    document.getElementById('stockSource').textContent = 'Alpha Vantage API';
                } else {
                    stockData = [...defaultStocks];
                    document.getElementById('stockSource').textContent = 'Simulated data';
                }

            } catch (error) {
                console.warn('API Error, using fallback data:', error);
                stockData = [...defaultStocks];
                document.getElementById('stockSource').textContent = 'Simulated data';
            }

            renderStocks();
            updateStockTime();
        }

        // ===== GET STOCK NAME =====
        function getStockName(symbol) {
            const names = {
                'RELIANCE': 'Reliance Industries',
                'TCS': 'Tata Consultancy',
                'HDFCBANK': 'HDFC Bank',
                'INFY': 'Infosys',
                'ICICIBANK': 'ICICI Bank',
                'SBIN': 'SBI',
                'BHARTIARTL': 'Bharti Airtel',
                'ITC': 'ITC Limited',
                'WIPRO': 'Wipro',
                'AXISBANK': 'Axis Bank'
            };
            return names[symbol] || symbol;
        }

        // ===== RENDER STOCKS (NO PRICE) =====
        function renderStocks() {
            const container = document.getElementById('stockList');
            if (!container) return;

            const sorted = [...stockData].sort((a, b) => Math.abs(b.change) - Math.abs(a.change));

            container.innerHTML = sorted.slice(0, 10).map(stock => {
                const isUp = stock.change >= 0;
                const changeClass = isUp ? 'up' : 'down';
                const arrow = isUp ? '▲' : '▼';
                const sign = isUp ? '+' : '';
                
                return `
                    <div class="stock-item">
                        <div class="stock-info">
                            <span class="stock-symbol">${stock.symbol}</span>
                            <span class="stock-name">${stock.name || stock.symbol}</span>
                        </div>
                        <span class="stock-change ${changeClass}">
                            <span class="arrow">${arrow}</span> ${sign}${stock.change.toFixed(1)}%
                        </span>
                    </div>
                `;
            }).join('');
        }

        // ===== UPDATE STOCK TIME =====
        function updateStockTime() {
            const timeEl = document.getElementById('stockUpdateTime');
            if (timeEl) {
                const now = new Date();
                timeEl.textContent = now.toLocaleTimeString('en-IN', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
        }

        // ===== SIMULATE STOCK CHANGES =====
        function simulateStockChanges() {
            if (document.getElementById('stockSource').textContent === 'Alpha Vantage API') {
                return;
            }
            
            stockData.forEach(stock => {
                const change = (Math.random() * 6) - 3;
                stock.change = parseFloat(change.toFixed(1));
            });
            renderStocks();
            updateStockTime();
        }

        // ===== INIT STOCKS =====
        function initStocks() {
            fetchStocksFromAPI();
            
            setInterval(() => {
                if (document.getElementById('stockSource').textContent === 'Alpha Vantage API') {
                    fetchStocksFromAPI();
                } else {
                    simulateStockChanges();
                }
            }, 30000);
        }

        // ===== INIT =====
        fetchUsers();
        initStocks();

        console.log('%c📊 CA Dashboard', 'font-size: 20px; font-weight: bold; color: #1a237e;');
        console.log(`%cWelcome back, ${userData.fullName}!`, 'font-size: 14px; color: #4a4a6a;');
        console.log('%c📋 Dashboard loaded successfully', 'font-size: 12px; color: #8a8aa8;');
        console.log('%c📈 Stock market shows only symbol and change percentage (no price)', 'font-size: 12px; color: #1a237e;');
        console.log('%c🌐 Language selector available - click the globe icon to translate', 'font-size: 12px; color: #1a237e;');
    </script>

</body>
</html>
