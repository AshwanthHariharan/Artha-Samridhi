<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artha Samridhi — Profile</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f1f2f6;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aa8;
            --accent-1: #1a237e;
            --accent-2: #283593;
            --accent-3: #3949ab;
            --accent-4: #5c6bc0;
            --accent-gradient: linear-gradient(135deg, #1a237e 0%, #283593 40%, #3949ab 70%, #5c6bc0 100%);
            --shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 8px 40px rgba(26, 35, 126, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --error-color: #c62828;
            --success-color: #2e7d32;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== SOFT ORBS ========== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: orbFloat 25s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: rgba(26, 35, 126, 0.06);
            top: -15%;
            right: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(57, 73, 171, 0.04);
            bottom: -15%;
            left: -10%;
            animation-delay: -8s;
        }
        .orb-3 {
            width: 400px;
            height: 400px;
            background: rgba(26, 35, 126, 0.03);
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: -16s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -60px) scale(1.1); }
            66% { transform: translate(-40px, 50px) scale(0.9); }
            100% { transform: translate(30px, -30px) scale(1.05); }
        }

        /* ========== LANGUAGE SELECTOR ========== */
        .language-selector {
            position: relative;
            display: inline-block;
            margin-left: 10px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            font-family: inherit;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.10);
            color: var(--text-primary);
        }

        .lang-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius-sm);
            padding: 6px 0;
            box-shadow: var(--shadow-hover);
            min-width: 180px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }

        .lang-dropdown.open {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .lang-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .lang-item:hover {
            background: rgba(26, 35, 126, 0.04);
            color: var(--text-primary);
        }

        .lang-item.active {
            background: rgba(26, 35, 126, 0.06);
            color: var(--accent-1);
        }

        .lang-item .lang-code {
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .lang-item .lang-check {
            margin-left: auto;
            color: var(--accent-1);
            font-size: 0.7rem;
        }

        #translatingStatus {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 8px;
            display: none;
        }

        #translatingStatus i {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== NAVBAR ========== */
        .navbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1200px;
            z-index: 1000;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 60px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.04);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .navbar.scrolled {
            top: 0;
            left: 0;
            transform: translateX(0);
            width: 100%;
            max-width: 100%;
            border-radius: 0;
            padding: 10px 32px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 30px rgba(0, 0, 0, 0.05);
            border-left: none;
            border-right: none;
            border-top: none;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .navbar .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .logo .logo-img {
            height: 38px;
            width: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(26, 35, 126, 0.10);
            padding: 2px;
            transition: var(--transition);
        }

        .navbar.scrolled .logo .logo-img {
            height: 34px;
            width: 34px;
        }

        .logo .logo-text {
            color: var(--text-primary);
            font-weight: 700;
        }

        .logo .logo-text .highlight {
            color: var(--accent-1);
        }

        .logo .logo-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-gradient);
            margin-left: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
            padding: 4px 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gradient);
            transition: var(--transition);
            border-radius: 4px;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            padding: 10px 40px;
            background: var(--accent-gradient);
            color: #fff !important;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(26, 35, 126, 0.15);
            letter-spacing: 0.02em;
            min-width: 120px;
            text-align: center;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(26, 35, 126, 0.20);
            color: #fff !important;
        }

        .nav-cta i {
            margin-right: 8px;
        }

        .navbar.scrolled .nav-cta {
            padding: 10px 44px;
        }

        /* ========== PROFILE CONTAINER ========== */
        .profile-container {
            padding: 140px 24px 60px;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ========== HEADER ========== */
        .profile-header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-header-section .logo-large {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .profile-header-section .logo-large img {
            height: 48px;
            width: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(26, 35, 126, 0.10);
            padding: 2px;
        }

        .profile-header-section .logo-large .brand-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .profile-header-section .logo-large .brand-name .highlight {
            color: var(--accent-1);
        }

        .profile-header-section h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 4px;
            color: var(--text-primary);
        }

        .profile-header-section h1 .highlight {
            color: var(--accent-1);
        }

        .profile-header-section p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 4px;
        }

        .profile-header-section .tech-line {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .profile-header-section .tech-line span {
            width: 40px;
            height: 2px;
            background: var(--accent-gradient);
            border-radius: 4px;
            opacity: 0.2;
        }

        .profile-header-section .tech-line span:nth-child(2) { width: 60px; opacity: 0.3; }
        .profile-header-section .tech-line span:nth-child(3) { width: 80px; opacity: 0.4; }
        .profile-header-section .tech-line span:nth-child(4) { width: 60px; opacity: 0.3; }
        .profile-header-section .tech-line span:nth-child(5) { width: 40px; opacity: 0.2; }

        /* ========== PROFILE CARD ========== */
        .profile-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius);
            padding: 40px 44px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
            opacity: 0.3;
        }

        /* ===== PROFILE HEADER ===== */
        .profile-avatar-section {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(26, 35, 126, 0.15);
        }

        .profile-avatar-info h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .profile-avatar-info .role-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        .profile-avatar-info .role-badge.investor {
            background: rgba(26, 35, 126, 0.08);
            color: var(--accent-1);
            border: 1px solid rgba(26, 35, 126, 0.10);
        }
        .profile-avatar-info .role-badge.entrepreneur {
            background: rgba(57, 73, 171, 0.08);
            color: var(--accent-3);
            border: 1px solid rgba(57, 73, 171, 0.10);
        }
        .profile-avatar-info .role-badge.ca {
            background: rgba(46, 125, 50, 0.08);
            color: #2e7d32;
            border: 1px solid rgba(46, 125, 50, 0.10);
        }
        .profile-avatar-info .role-badge.advocate {
            background: rgba(198, 40, 40, 0.08);
            color: #c62828;
            border: 1px solid rgba(198, 40, 40, 0.10);
        }

        .profile-avatar-info .member-since {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ===== PROFILE GRID ===== */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 32px;
        }

        .profile-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .profile-item .label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .profile-item .value {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-top: 2px;
            word-break: break-word;
        }

        /* ===== ROLE DETAILS SECTION ===== */
        .role-details-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .role-details-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .role-details-section h3 i {
            color: var(--accent-1);
        }

        /* ===== ACTION BUTTONS ===== */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .btn-dashboard {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(26, 35, 126, 0.15);
            cursor: pointer;
        }

        .btn-dashboard:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 36px rgba(26, 35, 126, 0.25);
            color: #fff;
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            background: rgba(198, 40, 40, 0.06);
            color: var(--error-color);
            border: 1px solid rgba(198, 40, 40, 0.10);
            border-radius: 100px;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
        }

        .btn-logout:hover {
            background: rgba(198, 40, 40, 0.12);
            transform: translateY(-3px);
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            background: rgba(0, 0, 0, 0.03);
            color: var(--text-secondary);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 100px;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-home:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: translateY(-3px);
            color: var(--text-primary);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            .profile-container {
                padding: 130px 20px 40px;
            }
            .profile-card {
                padding: 32px 28px;
            }
            .nav-cta {
                padding: 10px 32px;
                min-width: 100px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                top: 0;
                left: 0;
                transform: translateX(0);
                width: 100%;
                border-radius: 0;
                padding: 10px 16px;
                background: rgba(255, 255, 255, 0.90);
                box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            }
            .navbar.scrolled {
                padding: 8px 16px;
            }
            .nav-links {
                display: none;
            }
            .profile-container {
                padding: 110px 16px 30px;
            }
            .profile-card {
                padding: 24px 18px;
            }
            .profile-header-section .logo-large img {
                height: 36px;
                width: 36px;
            }
            .profile-header-section .logo-large .brand-name {
                font-size: 1.2rem;
            }
            .profile-header-section h1 {
                font-size: 1.5rem;
            }
            .profile-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .profile-avatar-section {
                flex-direction: column;
                text-align: center;
            }
            .profile-header-section .tech-line span {
                width: 20px;
            }
            .profile-header-section .tech-line span:nth-child(2) { width: 30px; }
            .profile-header-section .tech-line span:nth-child(3) { width: 40px; }
            .profile-header-section .tech-line span:nth-child(4) { width: 30px; }
            .profile-header-section .tech-line span:nth-child(5) { width: 20px; }
            .nav-cta {
                padding: 8px 24px;
                font-size: 0.8rem;
                min-width: 80px;
            }
            .action-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .action-buttons .btn-dashboard,
            .action-buttons .btn-logout,
            .action-buttons .btn-home {
                justify-content: center;
            }
            .language-selector {
                margin-left: 4px;
            }
            .lang-btn .lang-label {
                display: none;
            }
            .lang-dropdown {
                right: -20px;
                min-width: 160px;
            }
        }

        @media (max-width: 480px) {
            .profile-container {
                padding: 100px 12px 20px;
            }
            .profile-card {
                padding: 18px 14px;
                border-radius: 12px;
            }
            .profile-header-section .logo-large img {
                height: 28px;
                width: 28px;
            }
            .profile-header-section .logo-large .brand-name {
                font-size: 1rem;
            }
            .profile-header-section h1 {
                font-size: 1.3rem;
            }
            .profile-avatar {
                width: 64px;
                height: 64px;
                font-size: 1.6rem;
            }
            .profile-avatar-info h2 {
                font-size: 1.2rem;
            }
            .navbar {
                padding: 8px 14px;
            }
            .navbar.scrolled {
                padding: 6px 14px;
            }
            .logo .logo-img {
                height: 28px;
                width: 28px;
            }
            .logo .logo-text {
                font-size: 1rem;
            }
            .nav-cta {
                padding: 6px 18px;
                font-size: 0.75rem;
                min-width: 60px;
            }
            .nav-cta i {
                margin-right: 4px;
            }
            .lang-btn {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            .lang-dropdown {
                right: -40px;
                min-width: 140px;
            }
        }
                /* ========== CHATBOT BUTTON ========== */
        .chatbot-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(26, 35, 126, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .chatbot-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 40px rgba(26, 35, 126, 0.35);
        }

        .chatbot-fab .fa-robot {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ===== CHATBOT SIDEBAR ===== */
        .chatbot-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: var(--bg-card);
            box-shadow: -4px 0 40px rgba(0, 0, 0, 0.08);
            z-index: 1001;
            transition: right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(0, 0, 0, 0.04);
        }

        .chatbot-sidebar.open {
            right: 0;
        }

        .chatbot-sidebar-header {
            padding: 20px 24px;
            background: var(--accent-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chatbot-sidebar-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chatbot-sidebar-header .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 4px;
        }

        .chatbot-sidebar-header .close-btn:hover {
            color: #fff;
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-primary);
        }

        .chatbot-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: rgba(26, 35, 126, 0.15);
            border-radius: 10px;
        }

        .chatbot-message {
            display: flex;
            gap: 10px;
            max-width: 92%;
            animation: slideIn 0.3s ease;
        }

        .chatbot-message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chatbot-message.bot {
            align-self: flex-start;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chatbot-message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .chatbot-message.bot .chatbot-message-avatar {
            background: var(--accent-gradient);
            color: #fff;
        }

        .chatbot-message.user .chatbot-message-avatar {
            background: rgba(0, 0, 0, 0.06);
            color: var(--text-muted);
        }

        .chatbot-message-content {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.6;
            word-wrap: break-word;
            max-width: 100%;
        }

        .chatbot-message.bot .chatbot-message-content {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-top-left-radius: 4px;
        }

        .chatbot-message.user .chatbot-message-content {
            background: var(--accent-gradient);
            color: #fff;
            border-top-right-radius: 4px;
        }

        .chatbot-message-content p {
            margin: 0;
        }

        .chatbot-message-content p + p {
            margin-top: 6px;
        }

        .chatbot-typing {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .chatbot-typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .chatbot-typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .chatbot-typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .chatbot-input-area {
            padding: 16px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            background: var(--bg-card);
        }

        .chatbot-input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 100px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .chatbot-input-area input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.06);
        }

        .chatbot-input-area input::placeholder {
            color: var(--text-muted);
        }

        .chatbot-send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chatbot-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(26, 35, 126, 0.20);
        }

        .chatbot-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .chatbot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .chatbot-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body>

    <!-- ===== SOFT ORBS ===== -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Artha Samridhi" class="logo-img" onerror="this.style.display='none'" />
                <span class="logo-text">Artha<span class="highlight">Samridhi</span><span class="logo-dot"></span></span>
            </a>

            <div class="nav-links">
                <a href="index.html#features">Platform</a>
                <a href="index.html#cta">About</a>
                <a href="#" class="nav-cta">
                    <i class="fas fa-user"></i> Profile
                </a>
            </div>

            <!-- ===== LANGUAGE SELECTOR ===== -->
            <div class="language-selector">
                <button class="lang-btn" onclick="toggleLanguageMenu()" title="Select Language (Ctrl+Shift+L)">
                    <i class="fas fa-globe"></i>
                    <span id="currentLangLabel" class="lang-label">English</span>
                    <i class="fas fa-chevron-down" style="font-size: 0.6rem;"></i>
                </button>
                <div class="lang-dropdown" id="langDropdown"></div>
            </div>
            <span id="translatingStatus"><i class="fas fa-spinner fa-spin"></i> Translating...</span>

        </div>
    </nav>

    <!-- ===== PROFILE CONTAINER ===== -->
    <div class="profile-container">

        <!-- ===== HEADER ===== -->
        <div class="profile-header-section">
            <div class="logo-large">
                <img src="logo.png" alt="Artha Samridhi" onerror="this.style.display='none'" />
                <span class="brand-name">Artha<span class="highlight">Samridhi</span></span>
            </div>
            <h1>My <span class="highlight">Profile</span></h1>
            <p>Manage your account and view your details</p>
            <div class="tech-line">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- ===== PROFILE CARD ===== -->
        <div class="profile-card">
            <div id="profileContent">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

    </div>
    <!-- ===== CHATBOT FAB BUTTON ===== -->
    <button class="chatbot-fab" onclick="toggleChatbot()" id="chatbotToggle" title="Chat with AI Assistant">
        <i class="fas fa-robot"></i>
    </button>

    <!-- ===== CHATBOT SIDEBAR ===== -->
    <div class="chatbot-sidebar" id="chatbotSidebar">
        <div class="chatbot-sidebar-header">
            <h3><i class="fas fa-robot"></i> AI Assistant</h3>
            <button class="close-btn" onclick="toggleChatbot()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="chatbot-message bot">
                <div class="chatbot-message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="chatbot-message-content">
                    <p>Hello! 👋 I'm your AI assistant for Artha Samridhi. How can I help you with your venture today?</p>
                </div>
            </div>
        </div>
        <div class="chatbot-input-area">
            <input type="text" id="chatbotInput" placeholder="Type your message..." onkeydown="handleChatbotKeypress(event)" />
            <button class="chatbot-send-btn" onclick="sendChatbotMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    <!-- ===== JAVASCRIPT ===== -->
    <script src="translator.js"></script>
    <script src="chatbot.js"></script>
    <script>
        // ===== LOAD USER DATA =====
        const userData = JSON.parse(localStorage.getItem('userData'));

        if (!userData) {
            window.location.href = 'index.html';
        }

        // ===== NAVBAR SCROLL EFFECT =====
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 30) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        }, { passive: true });

        // ===== HELPER FUNCTIONS =====
        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ')
                .map(n => n[0])
                .join('')
                .toUpperCase()
                .slice(0, 2);
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function getRoleDisplay(role) {
            const roles = {
                'INVESTOR': 'Investor',
                'ENTREPRENEUR': 'Entrepreneur',
                'CA_GRADUATE': 'CA Graduate',
                'ADVOCATE': 'Advocate'
            };
            return roles[role] || role;
        }

        function getRoleClass(role) {
            const classes = {
                'INVESTOR': 'investor',
                'ENTREPRENEUR': 'entrepreneur',
                'CA_GRADUATE': 'ca',
                'ADVOCATE': 'advocate'
            };
            return classes[role] || '';
        }

        // ===== RENDER PROFILE =====
        function renderProfile(user) {
            const roleClass = getRoleClass(user.role);
            const roleDisplay = getRoleDisplay(user.role);

            let roleDetailsHTML = '';
            let dashboardButton = '';

            // ===== DASHBOARD BUTTON FOR ENTREPRENEURS =====
            if (user.role === 'ENTREPRENEUR') {
                dashboardButton = `
                    <a href="entrepreneur-dashboard.html" class="btn-dashboard">
                        <i class="fas fa-th-large"></i> Go to Dashboard
                    </a>
                `;
            }

            // ===== DASHBOARD BUTTON FOR INVESTORS =====
            if (user.role === 'INVESTOR') {
                dashboardButton = `
                    <a href="investor-dashboard.html" class="btn-dashboard">
                        <i class="fas fa-chart-line"></i> Go to Dashboard
                    </a>
                `;
            }

            // ===== DASHBOARD BUTTON FOR CA GRADUATES =====
            if (user.role === 'CA_GRADUATE') {
                dashboardButton = `
                    <a href="ca-dashboard.html" class="btn-dashboard">
                        <i class="fas fa-file-invoice"></i> Go to Dashboard
                    </a>
                `;
            }

            // ===== DASHBOARD BUTTON FOR ADVOCATES =====
            if (user.role === 'ADVOCATE') {
                dashboardButton = `
                    <a href="advocate-dashboard.html" class="btn-dashboard">
                        <i class="fas fa-balance-scale"></i> Go to Dashboard
                    </a>
                `;
            }

            // ===== INVESTOR DETAILS =====
            if (user.role === 'INVESTOR' && user.investorDetails) {
                const d = user.investorDetails;
                roleDetailsHTML = `
                    <div class="role-details-section">
                        <h3><i class="fas fa-hand-holding-dollar"></i> Investor Details</h3>
                        <div class="profile-grid">
                            <div class="profile-item">
                                <div class="label">Investment Amount</div>
                                <div class="value">$${d.amount || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Portfolios</div>
                                <div class="value">${d.portfolios || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Industry</div>
                                <div class="value">${d.industry || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Firm Type</div>
                                <div class="value">${d.firmType || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Qualification</div>
                                <div class="value">${d.qualification || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Nature of Investment</div>
                                <div class="value">${d.natureOfInvestment || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ===== ENTREPRENEUR DETAILS =====
            if (user.role === 'ENTREPRENEUR' && user.entrepreneurDetails) {
                const d = user.entrepreneurDetails;
                roleDetailsHTML = `
                    <div class="role-details-section">
                        <h3><i class="fas fa-lightbulb"></i> Entrepreneur Details</h3>
                        <div class="profile-grid">
                            <div class="profile-item">
                                <div class="label">Company Name</div>
                                <div class="value">${d.companyName || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Industry</div>
                                <div class="value">${d.industry || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Stage</div>
                                <div class="value">${d.stage || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Funding Goal</div>
                                <div class="value">$${d.fundingGoal || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Team Size</div>
                                <div class="value">${d.teamSize || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Qualification</div>
                                <div class="value">${d.qualification || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ===== CA GRADUATE DETAILS =====
            if (user.role === 'CA_GRADUATE' && user.caDetails) {
                const d = user.caDetails;
                roleDetailsHTML = `
                    <div class="role-details-section">
                        <h3><i class="fas fa-file-invoice"></i> CA Graduate Details</h3>
                        <div class="profile-grid">
                            <div class="profile-item">
                                <div class="label">Registration Number</div>
                                <div class="value">${d.registrationNumber || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Specialization</div>
                                <div class="value">${d.specialization || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Experience</div>
                                <div class="value">${d.experience || 'N/A'} years</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Firm Name</div>
                                <div class="value">${d.firmName || 'Not provided'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ===== ADVOCATE DETAILS =====
            if (user.role === 'ADVOCATE' && user.advocateDetails) {
                const d = user.advocateDetails;
                roleDetailsHTML = `
                    <div class="role-details-section">
                        <h3><i class="fas fa-gavel"></i> Advocate Details</h3>
                        <div class="profile-grid">
                            <div class="profile-item">
                                <div class="label">Bar Council ID</div>
                                <div class="value">${d.barCouncilId || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Specialization</div>
                                <div class="value">${d.specialization || 'N/A'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Experience</div>
                                <div class="value">${d.experience || 'N/A'} years</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Firm Name</div>
                                <div class="value">${d.firmName || 'Not provided'}</div>
                            </div>
                            <div class="profile-item">
                                <div class="label">Court Practiced</div>
                                <div class="value">${d.courtPracticed || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <!-- Avatar Section -->
                <div class="profile-avatar-section">
                    <div class="profile-avatar">${getInitials(user.fullName)}</div>
                    <div class="profile-avatar-info">
                        <h2>${user.fullName}</h2>
                        <span class="role-badge ${roleClass}">${roleDisplay}</span>
                        <div class="member-since">
                            <i class="far fa-calendar-alt"></i> Member since ${formatDate(user.createdAt)}
                        </div>
                    </div>
                </div>

                <!-- Basic Details -->
                <div class="profile-grid">
                    <div class="profile-item">
                        <div class="label">Email</div>
                        <div class="value">${user.email}</div>
                    </div>
                    <div class="profile-item">
                        <div class="label">Mobile</div>
                        <div class="value">${user.mobile}</div>
                    </div>
                    <div class="profile-item">
                        <div class="label">Date of Birth</div>
                        <div class="value">${formatDate(user.dob)}</div>
                    </div>
                    <div class="profile-item">
                        <div class="label">Role</div>
                        <div class="value">${roleDisplay}</div>
                    </div>
                </div>

                <!-- Role Details -->
                ${roleDetailsHTML}

                <!-- Action Buttons -->
                <div class="action-buttons">
                    ${dashboardButton}
                    <a href="index.html" class="btn-home">
                        <i class="fas fa-home"></i> Home
                    </a>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            `;
        }

        // ===== LOGOUT =====
        function logout() {
            localStorage.removeItem('userData');
            window.location.href = 'index.html';
        }

        // ===== RENDER THE PROFILE =====
        document.getElementById('profileContent').innerHTML = renderProfile(userData);

        // ===== CONSOLE =====
        console.log('%c👤 Artha Samridhi Profile', 'font-size: 20px; font-weight: bold; color: #1a237e;');
        console.log(`%cWelcome back, ${userData.fullName}!`, 'font-size: 14px; color: #4a4a6a;');
        console.log(`%cRole: ${getRoleDisplay(userData.role)}`, 'font-size: 12px; color: #8a8aa8;');
        
        // ===== ROLE-SPECIFIC DASHBOARD NOTIFICATION =====
        if (userData.role === 'ENTREPRENEUR') {
            console.log('%c🚀 You are an Entrepreneur! Click "Go to Dashboard" to access your startup dashboard.', 'font-size: 12px; color: #1a237e; font-weight: bold;');
        } else if (userData.role === 'INVESTOR') {
            console.log('%c💰 You are an Investor! Click "Go to Dashboard" to explore investment opportunities.', 'font-size: 12px; color: #1a237e; font-weight: bold;');
        } else if (userData.role === 'CA_GRADUATE') {
            console.log('%c📊 You are a CA Graduate! Click "Go to Dashboard" to access your CA dashboard.', 'font-size: 12px; color: #4a4a6a;');
        } else if (userData.role === 'ADVOCATE') {
            console.log('%c⚖️ You are an Advocate! Click "Go to Dashboard" to access your advocate dashboard.', 'font-size: 12px; color: #4a4a6a;');
        }
        console.log('%c🌐 Language selector available - click the globe icon to translate', 'font-size: 12px; color: #1a237e;');
    </script>

</body>
</html>
